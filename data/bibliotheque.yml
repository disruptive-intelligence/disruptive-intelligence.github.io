# Arborescence de la Bibliothèque — miroir du dépôt CyberSec-notes (Obsidian).
# domaine > catégorie > notes prévues.
#
# Une note IMPORTÉE est un fichier Markdown déposé dans docs/library/<domaine>/<catégorie>/
# (avec un titre `# ...` ou `title:` dans l'en-tête) : elle apparaît alors en lien dans le menu
# et sur la page de la catégorie. Les notes listées ici et pas encore importées s'affichent
# « à importer » : c'est la liste de travail de l'import depuis Obsidian.

