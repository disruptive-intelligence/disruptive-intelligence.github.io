          description: "Qui attaque, comment et pourquoi : les acteurs, leurs écosystèmes et l'état de la menace."
          notes: [CTI — les fondamentaux, Cyber Threat Intelligence — analyser et réduire l'incertitude, APT — menaces persistantes avancées, APT — synthèse, Panorama de la cybermenace — état de l'art, Cartographie des écosystèmes cybercriminels, Dark Web]
        - label: 🧪 Méthodes d'analyse
