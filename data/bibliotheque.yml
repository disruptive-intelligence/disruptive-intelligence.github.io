# Arborescence de la Bibliothèque — miroir du dépôt CyberSec-notes (Obsidian).
# domaine > catégorie > notes (ou sous-rubriques : groups > label + notes).
#
# Une note IMPORTÉE est un fichier Markdown déposé dans docs/library/<domaine>/<catégorie>/
# (scripts/import_notes.py) : elle apparaît dans le menu et sur la page de la catégorie.
# Une note listée ici et pas encore importée s'affiche « à importer ».
# Par catégorie : description (une phrase de périmètre) et debut (note conseillée pour commencer),
# affichées sur l'index de la Bibliothèque. glossaire: true = rangée sous « Glossaire & notions ».
# Titres : sujet clair d'abord, angle ensuite ; la provenance (HTB, L2I) est un badge, pas le titre.

- id: cyber
  label: 🛡️ Cyber
  categories:
    - id: cti
      label: 🎯 CTI & renseignement
      description: Comprendre les acteurs de la menace, produire et diffuser du renseignement.
      debut: Cyber Threat Intelligence (CTI)
      notes: [Cyber Threat Intelligence (CTI), APT — menaces persistantes avancées, APT — synthèse, Cartographie des écosystèmes cybercriminels, Dark Web, Panorama de la cybermenace — état de l'art, Contre-ingérence et guerre informationnelle, Intelligence économique, OPSEC & privacy, Red teaming analytique, Cyber Threat Intelligence — travaux pratiques]
    - id: osint
      label: 🔍 OSINT
      description: Rechercher, recouper et exploiter l'information ouverte, y compris financière et humaine.
      debut: OSINT — synthèse
      notes: [OSINT Mastery, OSINT — synthèse, FININT — investigation financière, OSINT & cryptoactifs, HUMINT & social engineering, Python pour l'OSINT et le scraping, OSINT — ressources]
    - id: cryptographie
      label: 🔐 Cryptographie
      description: Les bases du chiffrement et de ses usages.
      notes: [Cryptographie]
    - id: forensic
      label: 🧬 Forensic
      description: Collecter et analyser les traces d'un incident sur disque, en mémoire et dans les journaux.
      notes: [Digital forensics]
    - id: hardening
      label: 🧱 Hardening
      description: Réduire la surface d'attaque des systèmes, des identités et des applications.
      notes: [Sécurité système Windows, Identités et contrôle d'accès, AppSec]
    - id: cyberdefense
      label: 🚨 Cyberdéfense
      description: Détecter, investiguer et répondre ; gérer l'exposition ; piloter la sécurité dans la durée.
      debut: Analyste SOC
      groups:
        - label: 🛰️ Détection, investigation et réponse
          notes: [Analyste SOC, Réponse à incident, Réponse à incident — synthèse, Threat hunting, MITRE ATT&CK, "Frameworks de cyberdéfense (Kill chain, Pyramid of pain, UKC, Diamant)"]
        - label: 🩹 Vulnérabilités, exposition et MCS
          notes: [Vulnerability management & intelligence, Maintien en condition de sécurité (MCS), Attack Surface Management]
        - label: 🏛️ Gouvernance et résilience
          notes: ["Gouvernance, risques et conformité (GRC)", Sécurité IT en entreprise, Sauvegardes et reprise d'activité]
    - id: ia
      label: 🤖 IA & sécurité
      description: Les menaces propres à l'IA et la sécurisation de ses déploiements.
      notes: [IA et sécurité]
    - id: outils
      label: 🧰 Outils & solutions
      description: Les outils et solutions de sécurité, rangés par usage.
      # Sous-rubriques : à compléter au fil des notes (ex. « 📡 Scan & découverte », « 🕸️ Analyse web »)
      groups:
        - label: 🔎 Analyse & qualification d'IOC
          notes: [VirusTotal]
        - label: 🛡️ Solutions de sécurité
          notes: [Solutions de sécurité]
    - id: concepts
      label: 💡 Concepts
      description: Les fondamentaux — vocabulaire, familles d'attaques, fonctionnement des systèmes.
      debut: Menaces, attaques et malwares
      notes: [Taxonomie de la cybersécurité, "Menaces, attaques et malwares", Architecture et sécurité des systèmes, Cybersécurité du quotidien, VPN]
    - id: notions
      label: 📌 Fiches notions
