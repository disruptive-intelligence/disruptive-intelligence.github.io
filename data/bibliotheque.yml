# Arborescence de la Bibliothèque — le coffre Obsidian (CyberSec-notes-v2) suit la même organisation.
# domaine > catégorie > notes (ou sous-rubriques : groups > label + notes).
#
# Coffre : un dossier par domaine (Cyber, IT), puis par catégorie, nommé comme son libellé sans emoji et
# précédé de son numéro d'ordre (« Cyber/06 Détection & réponse/ ») ; un sous-dossier par sous-rubrique ;
# nom du fichier = titre de la note (« : » écrit « - »). scripts/import_notes.py en déduit la rubrique.
#
# Une note IMPORTÉE est un fichier Markdown déposé dans docs/library/<domaine>/<catégorie>/ : elle apparaît
# dans le menu et sur la page de la catégorie. Une note listée ici et pas encore importée s'affiche « à importer ».
# Par catégorie : description (une phrase de périmètre), debut (note conseillée pour commencer) et mots
# (mots-clés qui relient la rubrique aux analyses et dossiers de la veille). liens (rubrique ou sous-rubrique) :
# notes rangées ailleurs, rappelées ici dans le menu et sur la page. glossaire: true = rangée sous
# « Glossaire & notions ». Une synthèse « X — synthèse » est rangée sous le cours « X… » de sa rubrique.
# Titres : sujet clair d'abord, angle ensuite ; la provenance (HTB, L2I) est un badge, pas le titre.

