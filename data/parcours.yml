# Parcours d'apprentissage de la Bibliothèque (pages « 🎓 Parcours » et accueil).
# Une étape = le titre exact d'une note publiée (data/bibliotheque.yml) + une phrase « pourquoi ».
# Une étape dont la note n'est pas (encore) publiée est ignorée.

- id: debuter
  titre: Débuter en cybersécurité
  description: Les notions de base, les grandes familles d'attaques et les principes défensifs qui reviennent partout.
  etapes:
    - note: Triade CIA
      pourquoi: Ce que la sécurité protège — la grille pour lire n'importe quelle attaque.
    - note: Surface d'attaque
      pourquoi: Par où un attaquant peut entrer, et pourquoi réduire vaut mieux qu'empiler.
    - note: Menaces, attaques et malwares
      pourquoi: Les grandes familles d'attaques et de logiciels malveillants.
    - note: Défense en profondeur
      pourquoi: Le principe qui chapeaute la plupart des mesures défensives.
    - note: Moindre privilège
      pourquoi: Limiter l'impact d'une compromission.
    - note: "Fonctionnement du web : URL, DNS, HTTPS"
      pourquoi: Ce qui se passe réellement quand on ouvre un site.
    - note: Architecture et sécurité des systèmes
      pourquoi: CPU, systèmes d'exploitation, sécurité physique — sous le capot.
    - note: Cybersécurité du quotidien
      pourquoi: Appliquer ces principes à ses propres appareils et comptes.
    - note: Taxonomie de la cybersécurité
      pourquoi: La carte complète, à consulter quand une notion revient.

- id: analyste-soc
  titre: Devenir analyste SOC
  description: Connaître les systèmes surveillés, savoir ce qu'on cherche, puis détecter, investiguer et répondre.
  etapes:
    - note: Windows en profondeur
      pourquoi: Le système le plus surveillé — processus, authentification, journaux.
    - note: Linux — prises de notes
      pourquoi: L'autre moitié du parc et ses traces.
    - note: "IOC, IOA, TTP"
      pourquoi: Ce qu'on cherche dans la télémétrie, du plus fragile au plus durable.
    - note: Modèles d'analyse de la menace
      pourquoi: Kill Chain, Pyramid of Pain, Diamant et MITRE ATT&CK — les modèles qui structurent l'analyse d'une attaque.
    - note: "CVE, CWE, CVSS, EPSS, KEV"
      pourquoi: Lire une vulnérabilité citée dans une alerte ou un bulletin.
    - note: Analyste SOC
      pourquoi: Le métier — journaux, SIEM, détection, triage.
    - note: Réponse à incident — synthèse
      pourquoi: La gestion d'incident en une lecture.
    - note: Réponse à incident
      pourquoi: Le cours complet, de la préparation au retour d'expérience.
    - note: Investigation numérique (forensic)
      pourquoi: Aller jusqu'à la preuve sur disque et en mémoire.

- id: osint
  titre: Apprendre l'OSINT
  description: La méthode d'enquête en sources ouvertes, la protection de l'enquêteur et les terrains spécialisés.
  etapes:
    - note: OSINT — synthèse
      pourquoi: Le panorama de la discipline en une lecture.
    - note: OPSEC & privacy
      pourquoi: Se protéger avant d'enquêter.
    - note: OSINT — cours complet
      pourquoi: Le cours complet — méthode, sources, outils.
    - note: OSINT — ressources
      pourquoi: Les outils et sites de départ.
    - note: Python pour l'OSINT et le scraping
      pourquoi: Automatiser la collecte.
    - note: HUMINT & social engineering
      pourquoi: Le facteur humain, côté renseignement et côté manipulation.
    - note: FININT — investigation financière
      pourquoi: Suivre l'argent.
    - note: OSINT & cryptoactifs
      pourquoi: Enquêter sur la blockchain.

- id: conteneurs
  titre: Conteneurs, de Docker à Kubernetes
  description: Conteneuriser une application, l'orchestrer, puis tout reprendre en profondeur, sécurité comprise.
  etapes:
    - note: Docker
      pourquoi: Comprendre et manipuler les conteneurs — images, réseau, volumes, Compose.
    - note: Kubernetes
      pourquoi: Passer à l'orchestration — pods, déploiements, services.
    - note: Conteneurs — Docker & Kubernetes
      pourquoi: Le cours complet — production, CI/CD, observabilité et sécurité des conteneurs.
