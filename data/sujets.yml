# Sujets d'investigation Windows : les pages qui traitent d'une même question, quel que soit leur onglet.
#
# Sert à trois endroits (hooks/portal.py, « Même sujet ») :
#  - en tête de chaque page citée ici, une barre qui renvoie aux autres pages du sujet (fiche, commandes,
#    cours, labs) ; une page citée par plusieurs sujets affiche la liste de ses sujets ;
#  - la page Cheat sheets › Windows › Journaux et événements, rubrique « Par situation » ;
#  - la page Labs, qui en déduit les compétences de chaque lab.
#
# Aucun texte nouveau : seulement des liens. Chemin = fichier dans docs/ ; « #Intitulé » = intitulé exact de la
# section (l'ancre est calculée). Labs : nommés par leur sujet, jamais par leur numéro. situation : donnees (j'ai des journaux à lire), soupcon (je soupçonne…),
# rien (je ne trouve rien). Libellé d'un lien : court, il s'affiche dans une barre.

