site_name: Disruptive Intelligence
site_description: Tech · IA · Cyber · Géopolitique — veille, analyses et base de connaissances
site_url: https://disruptive-intelligence.github.io/
docs_dir: docs

theme:
  name: material
  favicon: assets/icons/favicon.png
  logo: assets/icons/logo.png
  custom_dir: overrides         # surcharge du header (onglets dans la barre)
  language: fr
  palette:
    # Sombre par défaut, bascule clair/sombre disponible
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Mode clair
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Mode sombre
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs         # onglets en haut : Veille, Analyses, Dossiers, Cheat sheets, Bibliothèque
    - navigation.tabs.sticky  # requis : sinon Material ajoute une 2e barre d'onglets
    - navigation.prune        # menu : seule la partie visible est écrite dans chaque page (Bibliothèque : 400+ pages)
    - navigation.sections     # grandes parties = en-têtes (style HackTricks)
    - navigation.indexes      # index.md = page d'accueil d'une section
    - navigation.path         # fil d'Ariane (breadcrumbs)
    - navigation.footer       # précédent / suivant
    - navigation.top          # bouton retour en haut
    - navigation.tracking     # URL suit la section lue
    - toc.follow              # la table des matières suit la lecture
    - search.suggest
    - search.highlight
    - content.code.copy       # bouton copier sur les blocs de code
    - content.code.annotate   # annotations (1) dans le code
    - content.tabs.link       # onglets Linux/Windows synchronisés
    - content.footnote.tooltips  # notes de bas de page (sources des fiches) lisibles au survol

# Pages de fils et de semaines générées hors du menu (leurs index y figurent) : la barre
# latérale reste courte quel que soit le nombre de fils ou de semaines. Parcours : hors du menu de la
# Bibliothèque, accessibles depuis sa page d'accueil.
# Liens du menu vers les prochains jalons de l'agenda (/veille/agenda/#j-…) : voulus.
validation:
  nav:
    absolute_links: ignore

not_in_nav: |
  /veille/fils/*.md
  /veille/semaines/*.md
  /library/parcours/*.md

# Génère l'accueil, la veille, les analyses, les dossiers et les ressources
hooks:
  - hooks/portal.py

# Recharge le site local quand les données ou le hook changent
watch:
  - data
  - hooks

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sidebar-toggle.js
  - javascripts/glossary-tooltips.js   # définitions du glossaire au survol
  - javascripts/veille-tools.js        # Explorer, Pile de lecture, barre de lecture
  - javascripts/nav-lazy.js            # flèche du menu : déroule sur place sans changer de page
  - javascripts/cheatsheets.js         # cheat sheets : filtre des besoins

plugins:
  - search:
      lang: [fr, en]

markdown_extensions:
  - toc:
      permalink: true
  - admonition                # callouts : !!! note, warning, tip...
  - pymdownx.details          # blocs repliables : ??? note
  - pymdownx.superfences:
      custom_fences:          # schémas ```mermaid des notes Obsidian
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark             # surlignage ==texte== des notes Obsidian
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:        # cases à cocher [ ] / [x]
      custom_checkbox: true
  - tables
  - def_list                  # listes de définitions (glossaire)
  - attr_list
  - footnotes                 # appels [^1] + section Sources des fiches notions
  - md_in_html
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
