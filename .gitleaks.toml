# Configuration gitleaks du portail (lue automatiquement par le scan du workflow de publication).
# Règles par défaut (clés, jetons, mots de passe) + deux règles propres à un wiki de pentest public :
# aucun flag de CTF ni adresse de machine de lab HackTheBox ne doit être publié.
title = "Disruptive Intelligence — secrets, flags et IP de lab"

[extend]
useDefault = true

[[rules]]
id = "ctf-flag"
description = "Flag de CTF (HTB{…}, THM{…}, flag{…})"
regex = '''(?i)\b(?:HTB|THM|flag)\{[^}\s]{4,}\}'''
keywords = ["htb{", "thm{", "flag{"]

[[rules]]
id = "htb-lab-ip"
description = "Adresse d'une machine ou du VPN HackTheBox (10.10.x.x, 10.129.x.x)"
regex = '''\b10\.(?:10|129)\.\d{1,3}\.\d{1,3}\b'''
keywords = ["10.10.", "10.129."]

# Seules exceptions : les adresses d'exemple des conventions et des tests du masquage (import_notes).
[[allowlists]]
description = "Adresses d'exemple documentées"
paths = ['''^docs/start/conventions\.md$''', '''^tests/test_import_notes\.py$''']   # tests : IP à masquer

# Bibliothèque : identifiants factices des exemples de cours (curl -u admin:admin, clé « sk_live_abc123… »).
[[allowlists]]
description = "Exemples de cours de la Bibliothèque"
condition = "AND"
paths = ['''^docs[\\/]library[\\/]''']   # « \ » : contrôle local de scripts/import_notes.py sous Windows
regexTarget = "line"
regexes = [
  '''\badmin:admin\b''',
  '''YWRtaW46YWRtaW4=''',
  '''\buser:pass\b''',
  '''sk_live_(?:abc123|secret)\.\.\.''',
]

# Faux positif dans l'historique : nom de la clé localStorage du sélecteur de variantes de la Bibliothèque
# (aperçu d'octobre 2026, fichier supprimé depuis).
[[allowlists]]
description = "Clé localStorage de l'ancien sélecteur de variantes"
condition = "AND"
paths = ['''^docs/javascripts/bibliotheque-variantes\.js$''']
regexTarget = "line"
regexes = ['''var KEY = "kw-bv-variante\d*";''']

# IP de lab HTB publiées par erreur dans les sorties de la fiche Énumération (24/10/2026), masquées
# (10.129. -> 10.1.) dès le commit suivant : seul ce commit de l'historique est exempté.
[[allowlists]]
description = "IP de lab masquées au commit suivant (fiche Énumération et audit local)"
commits = ["377ab8ce54ec71380703a8ac1ecae155c3611851"]
