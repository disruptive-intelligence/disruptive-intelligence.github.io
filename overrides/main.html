{#- Icônes : écran d'accueil iPhone / Android, couleur de la barre du navigateur, flux RSS -#}
{% extends "base.html" %}

{% block extrahead %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ 'assets/icons/apple-touch-icon.png' | url }}">
  <link rel="manifest" href="{{ 'site.webmanifest' | url }}">
  <meta name="apple-mobile-web-app-title" content="Disruptive">
  <meta name="theme-color" content="#151111">
  <link rel="alternate" type="application/rss+xml" title="Disruptive Intelligence" href="{{ 'feed.xml' | url }}">
  <link rel="alternate" type="application/rss+xml" title="Morning Intelligence Brief" href="{{ 'veille/feed.xml' | url }}">
{% endblock %}
